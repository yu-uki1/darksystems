<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine GitHub Pages Website</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #24292e;
            margin-bottom: 10px;
        }
        p {
            color: #586069;
            font-size: 1.1em;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            background-color: #2ea44f;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Erfolg! 🎉</h1>
        <p>Deine GitHub Pages Website wurde erfolgreich erstellt und ist jetzt online erreichbar.</p>
        <span class="badge">Live</span>
    </div>

</body>
</html>
